<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Productos</ui:define>
    <ui:define name="header_titulo">Gestión de Productos</ui:define>

    <ui:define name="contenido">
        <h:form id="frmAcciones">
            <p:commandButton value="Nuevo Producto" 
                             styleClass="btn-primary" 
                             icon="pi pi-plus" 
                             actionListener="#{productoFrm.nuevoRegistro()}"
                             update=":frmNuevo"
                             oncomplete="PF('dlgNuevo').show()" 
                             style="margin-bottom: 15px;" />
        </h:form>

        <h:form id="frmTabla">
            <p:dataTable id="tblProducto" 
                         var="prod" 
                         value="#{productoFrm.listaProductos}" 
                         paginator="true" 
                         rows="5"
                         rowsPerPageTemplate="5,10,15">

                <p:column headerText="ID">
                    <h:outputText value="#{prod.idProducto}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{prod.nombre}" />
                </p:column>

                <p:column headerText="Estado">
                    <p:tag value="#{prod.activo ? 'ACTIVO' : 'INACTIVO'}" 
                           severity="#{prod.activo ? 'success' : 'danger'}" />
                </p:column>

                <p:column headerText="Comentarios">
                    <h:outputText value="#{prod.comentarios}" />
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog header="Nuevo Producto" widgetVar="dlgNuevo" modal="true" responsive="true">
            <h:form id="frmNuevo">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="Nombre:" for="txtNombre" />
                    <p:inputText id="txtNombre" value="#{productoFrm.registroSeleccionado.nombre}" required="true" />

                    <p:outputLabel value="Estado:" for="chkActivo" />
                    <p:selectBooleanCheckbox id="chkActivo" value="#{productoFrm.registroSeleccionado.activo}" />

                    <p:outputLabel value="Comentarios:" for="txtComentarios" />
                    <p:inputTextarea id="txtComentarios" value="#{productoFrm.registroSeleccionado.comentarios}"/>
                </h:panelGrid>

                <div style="text-align: right; margin-top: 10px;">
                    <p:commandButton value="Guardar" 
                                     actionListener="#{productoFrm.guardar()}" 
                                     update=":frmTabla:tblProducto :frmNuevo :messages" 
                                     oncomplete="if (!args.validationFailed) PF('dlgNuevo').hide()" 
                                     icon="pi pi-check" />
                </div>
            </h:form>
        </p:dialog>
    </ui:define>

</ui:composition>

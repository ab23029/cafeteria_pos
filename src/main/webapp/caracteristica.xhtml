<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Características</ui:define>
    <ui:define name="header_titulo">Administración de Características</ui:define>

    <ui:define name="contenido">
        <h:form id="frmCaracteristica">
            <p:panel header="Formulario de Característica">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre" value="#{caracteristicaFrm.registroSeleccionado.nombre}" required="true" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{caracteristicaFrm.registroSeleccionado.observaciones}" rows="3" cols="30" />
                </h:panelGrid>
                
                <p:commandButton value="Guardar" actionListener="#{caracteristicaFrm.btnGuardarHandler()}" 
                                 update="frmCaracteristica :messages" icon="pi pi-save" />
            </p:panel>

            <p:spacer height="20" />

            <p:dataTable value="#{caracteristicaFrm.registros}" var="c" id="tblCaracteristica" paginator="true" rows="10">
                <p:column headerText="ID">
                    <h:outputText value="#{c.idCaracteristica}" />
                </p:column>
                <p:column headerText="Nombre">
                    <h:outputText value="#{c.nombre}" />
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{c.observaciones}" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>

</ui:composition>

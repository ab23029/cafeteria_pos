<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Gestión de Tipo de Característica - Cafefe POS</title>
    </h:head>
    <h:body>
        <p:growl id="messages" showDetail="true" />

        <h:form id="frmTabla">
            <p:panel header="Gestión de Tipo de Característica">
                <!-- Botón para crear nuevo -->
                <p:commandButton value="Nuevo Tipo Característica" 
                                 actionListener="#{frmTipoCaracteristica.limpiar()}" 
                                 update=":dialogNuevo" 
                                 oncomplete="PF('dlgNuevo').show()" 
                                 icon="pi pi-plus" />

                <!-- Botón para volver a Tipo Descuento -->
                <p:button value="Volver a Tipo Descuento" 
                          outcome="TipoDescuento.xhtml" 
                          icon="pi pi-arrow-left" 
                          styleClass="ui-button-secondary" 
                          style="margin-left: 10px;" />

                <br/><br/>

                <p:dataTable id="dtTipoCaracteristica" 
                             value="#{frmTipoCaracteristica.tipoCaracteristicaDAO.findRange(0, 100)}" 
                             var="row" 
                             paginator="true" 
                             rows="10">

                    <p:column headerText="ID">
                        <h:outputText value="#{row.idTipoCaracteristica}" />
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{row.nombre}" />
                    </p:column>

                    <p:column headerText="Expresión Regular">
                        <h:outputText value="#{row.expresionRegular}" />
                    </p:column>

                    <p:column headerText="Estado">
                        <h:outputText value="#{row.activo ? 'ACTIVO' : 'INACTIVO'}" />
                    </p:column>

                    <p:column headerText="Observaciones">
                        <h:outputText value="#{row.observaciones}" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>

        <p:dialog header="Nuevo Tipo de Característica" widgetVar="dlgNuevo" id="dialogNuevo" modal="true" responsive="true">
            <h:form id="frmNuevo">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre" value="#{frmTipoCaracteristica.registro.nombre}" required="true" />

                    <p:outputLabel for="expresion" value="Expresión Regular:" />
                    <p:inputText id="expresion" value="#{frmTipoCaracteristica.registro.expresionRegular}" />

                    <p:outputLabel for="activo" value="Activo:" />
                    <p:selectBooleanCheckbox id="activo" value="#{frmTipoCaracteristica.registro.activo}" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{frmTipoCaracteristica.registro.observaciones}" />
                </h:panelGrid>

                <br/>
                <p:commandButton value="Guardar" 
                                 actionListener="#{frmTipoCaracteristica.btnCrearHandler()}" 
                                 update=":frmTabla:dtTipoCaracteristica :messages" 
                                 oncomplete="if (!args.validationFailed) PF('dlgNuevo').hide()" 
                                 icon="pi pi-check" />
            </h:form>
        </p:dialog>
    </h:body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">
        Gestión de Descuentos
    </ui:define>

    <ui:define name="header_titulo">
        Administración de Descuentos
    </ui:define>

    <ui:define name="contenido">

        <h:form id="frmDescuento">
            <p:panel header="Registro de Descuento">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="cboTipo" value="Tipo de Descuento: *" />
                    <p:selectOneMenu id="cboTipo" 
                                     value="#{descuentoFrm.idTipoDescuentoSeleccionado}" 
                                     disabled="#{descuentoFrm.registro.idDescuento != null}" 
                                     required="true">
                        <f:selectItem itemLabel="-- Seleccione Tipo Activo --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{descuentoFrm.listaTiposDescuento}" 
                                       var="td" 
                                       itemLabel="#{td.nombre} (Máx: #{td.descuentoMaximo}%)" 
                                       itemValue="#{td.idTipoDescuento}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="nombre" value="Nombre del Descuento: *" />
                    <p:inputText id="nombre" value="#{descuentoFrm.registro.nombre}" required="true" />

                    <p:outputLabel for="fechaDesde" value="Fecha Desde:" />
                    <p:datePicker id="fechaDesde" value="#{descuentoFrm.registro.fechaDesde}" showTime="true" pattern="dd/MM/yyyy HH:mm" />

                    <p:outputLabel for="fechaHasta" value="Fecha Hasta (Opcional):" />
                    <p:datePicker id="fechaHasta" value="#{descuentoFrm.registro.fechaHasta}" showTime="true" pattern="dd/MM/yyyy HH:mm" />

                    <p:outputLabel for="obs" value="Observaciones:" />
                    <p:inputTextarea id="obs" value="#{descuentoFrm.registro.observaciones}" rows="3" cols="30" />
                </h:panelGrid>

                <br/>
                <p:commandButton value="Guardar Descuento" 
                                 actionListener="#{descuentoFrm.btnGuardarHandler()}" 
                                 update="frmDescuento" 
                                 icon="pi pi-save" />

                <br/><br/>

                <p:dataTable id="dtDescuentos" value="#{descuentoFrm.listaRegistros}" var="d" emptyMessage="No hay descuentos registrados.">
                    <p:column headerText="ID">
                        <h:outputText value="#{d.idDescuento}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{d.nombre}" />
                    </p:column>
                    <p:column headerText="Tipo Descuento">
                        <h:outputText value="#{d.idTipoDescuento != null ? d.idTipoDescuento.nombre : ''}" />
                    </p:column>
                    <p:column headerText="Desde">
                        <h:outputText value="#{d.fechaDesde}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Hasta">
                        <h:outputText value="#{d.fechaHasta != null ? d.fechaHasta : 'Sin Fecha Fin (Abierto)'}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{d.observaciones}" />
                    </p:column>
                    <p:column headerText="Acciones">
                        <p:commandButton icon="pi pi-pencil" 
                                         actionListener="#{descuentoFrm.seleccionarRegistro(d)}" 
                                         update=":frmDescuento" 
                                         process="@this" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>

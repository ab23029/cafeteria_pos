<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Órdenes</ui:define>
    <ui:define name="header_titulo">Administración de Órdenes</ui:define>

    <ui:define name="contenido">
        <h:form id="frmOrden">
            <p:panel header="Formulario de Orden">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="idOrden" value="ID Orden:" />
                    <p:inputText id="idOrden" value="#{ordenFrm.registroSeleccionado.idOrden}" readonly="true" />

                    <p:outputLabel for="fechaCreacion" value="Fecha Creación:" />
                    <p:datePicker id="fechaCreacion" value="#{ordenFrm.registroSeleccionado.fechaCreacion}" showTime="true" />
                </h:panelGrid>
                
                <p:commandButton value="Guardar" actionListener="#{ordenFrm.btnGuardarHandler()}" 
                                 update="frmOrden :messages" icon="pi pi-save" />
            </p:panel>

            <p:spacer height="20" />

            <p:dataTable value="#{ordenFrm.registros}" var="o" id="tblOrden" paginator="true" rows="10">
                <p:column headerText="ID Orden">
                    <h:outputText value="#{o.idOrden}" />
                </p:column>
                <p:column headerText="Fecha Creación">
                    <h:outputText value="#{o.fechaCreacion}" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>

</ui:composition>

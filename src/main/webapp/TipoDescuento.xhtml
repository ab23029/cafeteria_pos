<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Tipo de Descuento</ui:define>
    <ui:define name="header_titulo">Gestión de Tipo de Descuento</ui:define>

    <ui:define name="contenido">
        <h:form id="frmAcciones">
            <p:commandButton value="Nuevo Tipo Descuento" 
                             styleClass="btn-primary" 
                             icon="pi pi-plus" 
                             oncomplete="PF('dlgNuevo').show()" 
                             style="margin-bottom: 15px;" />
        </h:form>

        <h:form id="frmTabla">
            <p:dataTable id="tblTipoDescuento" 
                         var="reg" 
                         value="#{tipoDescuentoFrm.registros}" 
                         paginator="true" 
                         rows="5"
                         rowsPerPageTemplate="5,10,15">

                <p:column headerText="ID">
                    <h:outputText value="#{reg.idTipoDescuento}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{reg.nombre}" />
                </p:column>

                <p:column headerText="Estado">
                    <p:tag value="#{reg.activo ? 'ACTIVO' : 'INACTIVO'}" 
                           severity="#{reg.activo ? 'success' : 'danger'}" />
                </p:column>

                <p:column headerText="Indicaciones">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog header="Nuevo Tipo de Descuento" widgetVar="dlgNuevo" modal="true" responsive="true">
            <h:form id="frmNuevo">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="Nombre:" for="txtNombre" />
                    <p:inputText id="txtNombre" value="#{tipoDescuentoFrm.registroSeleccionado.nombre}" required="true" />

                    <p:outputLabel value="Estado:" for="chkActivo" />
                    <p:selectBooleanCheckbox id="chkActivo" value="#{tipoDescuentoFrm.registroSeleccionado.activo}" />

                    <p:outputLabel value="Comentarios:" for="txtComentarios" />
                    <p:inputTextarea id="txtComentarios" value="#{tipoDescuentoFrm.registroSeleccionado.observaciones}"/>
                
                
                </h:panelGrid>

                <div style="text-align: right; margin-top: 10px;">
                    <p:commandButton value="Guardar" 
                                     action="#{tipoDescuentoFrm.guardar}" 
                                     update=":frmTabla:tblTipoDescuento :frmNuevo" 
                                     
                                     icon="pi pi-check" />
                </div>
            </h:form>
        </p:dialog>
    </ui:define>

</ui:composition>

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/WEB-INF/plantillas/general.xhtml">

        <ui:define name="titulo">
            Gestión de Tipo de Descuento
        </ui:define>

        <ui:define name="header_titulo">
            Gestión de Tipo de Descuento
        </ui:define>

        <ui:define name="contenido">
            <h:form id="frmAcciones">
                <p:toolbar style="margin-bottom: 10px;">
                    <p:toolbarGroup>
                        <p:commandButton value="Nuevo Tipo de Descuento" 
                                         icon="pi pi-plus" 
                                         actionListener="#{tipoDescuentoFrm.btnNuevoHandler()}"
                                         oncomplete="PF('dlgNuevo').show()" 
                                         update=":frmNuevo" />
                    </p:toolbarGroup>
                </p:toolbar>
            </h:form>

            <h:form id="frmTabla">
                <p:growl id="messagesTable" showDetail="true" />
                <p:dataTable id="tblTipoDescuento" 
                             value="#{tipoDescuentoFrm.registros}" 
                             var="item" 
                             paginator="true" 
                             rows="10" 
                             emptyMessage="No se encontraron registros">
                    <p:column headerText="Nombre">
                        <h:outputText value="#{item.nombre}" />
                    </p:column>
                    <p:column headerText="Descuento Máximo (%)">
                        <h:outputText value="#{item.descuentoMaximo}" />
                    </p:column>
                    <p:column headerText="Estado">
                        <h:outputText value="#{item.activo ? 'Activo' : 'Inactivo'}" />
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{item.observaciones}" />
                    </p:column>
                </p:dataTable>
            </h:form>

            <p:dialog header="Nuevo Tipo de Descuento" widgetVar="dlgNuevo" modal="true" resizable="false">
                <h:form id="frmNuevo">
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel value="Nombre:" for="txtNombre" />
                        <p:inputText id="txtNombre" value="#{tipoDescuentoFrm.registroSeleccionado.nombre}" required="true" />

                        <p:outputLabel value="Descuento Máximo (%):" for="txtMaximo" />
                        <p:spinner id="txtMaximo" value="#{tipoDescuentoFrm.registroSeleccionado.descuentoMaximo}" min="0" max="100" />

                        <p:outputLabel value="Estado:" for="chkActivo" />
                        <p:selectBooleanCheckbox id="chkActivo" value="#{tipoDescuentoFrm.registroSeleccionado.activo}" />

                        <p:outputLabel value="Observaciones:" for="txtObs" />
                        <p:inputTextarea id="txtObs" value="#{tipoDescuentoFrm.registroSeleccionado.observaciones}" rows="3" cols="30" />
                    </h:panelGrid>

                    <div style="text-align: right; margin-top: 10px;">
                        <p:commandButton value="Guardar" 
                                         actionListener="#{tipoDescuentoFrm.btnGuardarHandler()}" 
                                         update=":frmTabla:tblTipoDescuento :messages :frmNuevo" 
                                         oncomplete="if (!args.validationFailed) PF('dlgNuevo').hide()" 
                                         icon="pi pi-check" />
                    </div>
                </h:form>
            </p:dialog>
        </ui:define>

    </ui:composition>
</html>

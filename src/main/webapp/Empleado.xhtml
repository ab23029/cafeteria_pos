<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Empleados</ui:define>
    <ui:define name="header_titulo">Administración de Personal</ui:define>

    <ui:define name="contenido">
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            
            <!-- FORMULARIO DE REGISTRO -->
            <div style="flex: 1; min-width: 320px;">
                <p:card style="box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-top: 4px solid #06b6d4;">
                    <f:facet name="title">
                        <i class="pi pi-id-card" style="color: #06b6d4; margin-right: 8px;"></i>
                        #{empleadoFrm.registroSeleccionado.idEmpleado == null ? 'Nuevo Empleado' : 'Editar Empleado'}
                    </f:facet>

                    <h:form id="frmNuevo">
                        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
                            
                            <div>
                                <p:outputLabel value="Nombre:" for="txtNombre" style="font-weight: 600; display: block; margin-bottom: 6px;"/>
                                <p:inputText id="txtNombre" value="#{empleadoFrm.registroSeleccionado.nombre}" required="true" placeholder="Ej. Juan Carlos" style="width: 100%;"/>
                            </div>

                            <div>
                                <p:outputLabel value="Apellido:" for="txtApellido" style="font-weight: 600; display: block; margin-bottom: 6px;"/>
                                <p:inputText id="txtApellido" value="#{empleadoFrm.registroSeleccionado.apellido}" required="true" placeholder="Ej. Pérez Gómez" style="width: 100%;"/>
                            </div>

                            <div style="display: flex; align-items: center; gap: 10px;">
                                <p:selectBooleanCheckbox id="chkActivo" value="#{empleadoFrm.registroSeleccionado.activo}" />
                                <p:outputLabel value="Empleado Activo" for="chkActivo" style="font-weight: 600;"/>
                            </div>

                            <div>
                                <p:outputLabel value="Comentarios:" for="txtComentarios" style="font-weight: 600; display: block; margin-bottom: 6px;"/>
                                <p:inputTextarea id="txtComentarios" value="#{empleadoFrm.registroSeleccionado.comentarios}" rows="3" style="width: 100%;"/>
                            </div>

                            <div style="display: flex; gap: 10px; margin-top: 15px;">
                                <p:commandButton value="Guardar" 
                                                 actionListener="#{empleadoFrm.guardar()}" 
                                                 update=":frmTabla:tblEmpleado :frmNuevo :messages" 
                                                 icon="pi pi-save" 
                                                 styleClass="ui-button-info" style="flex: 1;" />
                                
                                <p:commandButton value="Limpiar" 
                                                 actionListener="#{empleadoFrm.nuevoRegistro()}" 
                                                 update=":frmNuevo" 
                                                 icon="pi pi-refresh" 
                                                 styleClass="ui-button-outlined ui-button-secondary" />
                            </div>
                        </div>
                    </h:form>
                </p:card>
            </div>

            <!-- TABLA DE EMPLEADOS -->
            <div style="flex: 2; min-width: 450px;">
                <p:card style="box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
                    <f:facet name="title">
                        <i class="pi pi-users" style="color: #64748b; margin-right: 8px;"></i>Personal Registrado
                    </f:facet>

                    <h:form id="frmTabla">
                        <p:dataTable id="tblEmpleado" 
                                     var="e" 
                                     value="#{empleadoFrm.listaEmpleado}" 
                                     paginator="true" 
                                     rows="6"
                                     paginatorPosition="bottom"
                                     size="small">

                            <p:column headerText="Nombre Completo">
                                <h:outputText value="#{e.nombre} #{e.apellido}" style="font-weight: bold; color: #1e293b;"/>
                            </p:column>

                            <p:column headerText="Estado" style="width: 100px; text-align: center;">
                                <p:tag value="#{e.activo ? 'ACTIVO' : 'INACTIVO'}" severity="#{e.activo ? 'success' : 'danger'}" />
                            </p:column>

                            <p:column headerText="Comentarios">
                                <h:outputText value="#{e.comentarios}" />
                            </p:column>

                            <p:column headerText="Acción" style="width: 80px; text-align: center;">
                                <p:commandButton icon="pi pi-pencil" 
                                                 actionListener="#{empleadoFrm.seleccionar(e)}" 
                                                 update=":frmNuevo" 
                                                 styleClass="ui-button-warning ui-button-flat" />
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </p:card>
            </div>

        </div>
    </ui:define>

</ui:composition>

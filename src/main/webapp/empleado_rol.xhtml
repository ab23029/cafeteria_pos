<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Gestión de Empleados y Roles - Cafefe POS</title>
    </h:head>
    <h:body>
        <p:growl id="messages" showDetail="true" />

        <h:form id="frmMain">
            <p:panel header="Gestión de Empleados y Roles">
                <!-- Botones de acción superior -->
                <div style="margin-bottom: 15px;">
                    <p:button value="Volver a Tipo Característica" 
                              outcome="tipo_caracteristica.xhtml" 
                              icon="pi pi-arrow-left" 
                              styleClass="ui-button-secondary" 
                              style="margin-right: 10px;" />

                    <p:commandButton value="Nuevo Empleado" 
                                     actionListener="#{empleadoRolFrm.limpiarEmpleado()}" 
                                     update=":dialogNuevoEmp" 
                                     oncomplete="PF('dlgNuevoEmp').show()" 
                                     icon="pi pi-user-plus" />
                </div>

                <div class="ui-g">
                    <!-- Tabla de Empleados (Maestro con todos los campos) -->
                    <div class="ui-g-12 ui-md-7">
                        <h3>Seleccione un Empleado</h3>
                        <p:dataTable id="dtEmpleados" 
                                     value="#{empleadoRolFrm.empleadoDAO.findRange(0, 50)}" 
                                     var="emp" 
                                     selectionMode="single" 
                                     selection="#{empleadoRolFrm.empleadoSeleccionado}" 
                                     rowKey="#{emp.idEmpleado}">

                            <p:ajax event="rowSelect" 
                                    listener="#{empleadoRolFrm.onEmpleadoSelect}" 
                                    update=":frmMain:pnlRoles :messages" />

                            <p:column headerText="Nombre">
                                <h:outputText value="#{emp.nombre}" />
                            </p:column>
                            
                            <p:column headerText="Apellido">
                                <h:outputText value="#{emp.apellido}" />
                            </p:column>

                            <p:column headerText="Estado">
                                <h:outputText value="#{emp.activo ? 'ACTIVO' : 'INACTIVO'}" />
                            </p:column>

                            <p:column headerText="Comentarios">
                                <h:outputText value="#{emp.comentarios}" />
                            </p:column>
                        </p:dataTable>
                    </div>

                    <!-- Panel de Roles Asignados (Detalle) -->
                    <div class="ui-g-12 ui-md-5">
                        <h:panelGroup id="pnlRoles">
                            <p:panel header="Roles de: #{empleadoRolFrm.empleadoSeleccionado != null ? empleadoRolFrm.empleadoSeleccionado.nombre : 'Ninguno'}">
                                
                                <h:panelGrid columns="2" cellpadding="5" rendered="#{empleadoRolFrm.empleadoSeleccionado != null}">
                                    <p:outputLabel for="cboRol" value="Rol:" />
                                    <p:selectOneMenu id="cboRol" value="#{empleadoRolFrm.idRolSeleccionado}">
                                        <f:selectItem itemLabel="-- Seleccione --" itemValue="" />
                                        <f:selectItems value="#{empleadoRolFrm.rolDAO.findAll()}" var="r" 
                                                       itemLabel="#{r.nombre}" itemValue="#{r.idRol}" />
                                    </p:selectOneMenu>

                                    <p:outputLabel for="obsRol" value="Observación:" />
                                    <p:inputText id="obsRol" value="#{empleadoRolFrm.observacionesRol}" />

                                    <p:commandButton value="Asignar Rol" 
                                                     actionListener="#{empleadoRolFrm.btnAsignarRolHandler()}" 
                                                     update="pnlRoles :messages" 
                                                     icon="pi pi-check" />
                                </h:panelGrid>

                                <br/>

                                <p:dataTable id="dtRolesAsignados" 
                                             value="#{empleadoRolFrm.rolesAsignados}" 
                                             var="er" 
                                             emptyMessage="El empleado no tiene roles asignados.">
                                    <p:column headerText="Rol">
                                        <h:outputText value="#{er.idRol.nombre}" />
                                    </p:column>
                                    <p:column headerText="Estado">
                                        <h:outputText value="#{er.activo ? 'ACTIVO' : 'INACTIVO'}" />
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                        </h:panelGroup>
                    </div>
                </div>
            </p:panel>
        </h:form>

        <!-- Dialog Modal para Crear Empleado -->
        <p:dialog header="Nuevo Empleado" widgetVar="dlgNuevoEmp" id="dialogNuevoEmp" modal="true" responsive="true">
            <h:form id="frmNuevoEmp">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="nombre" value="Nombre: *" />
                    <p:inputText id="nombre" value="#{empleadoRolFrm.nuevoEmpleado.nombre}" required="true" />

                    <p:outputLabel for="apellido" value="Apellido: *" />
                    <p:inputText id="apellido" value="#{empleadoRolFrm.nuevoEmpleado.apellido}" required="true" />

                    <p:outputLabel for="activo" value="Activo:" />
                    <p:selectBooleanCheckbox id="activo" value="#{empleadoRolFrm.nuevoEmpleado.activo}" />

                    <p:outputLabel for="comentarios" value="Comentarios:" />
                    <p:inputTextarea id="comentarios" value="#{empleadoRolFrm.nuevoEmpleado.comentarios}" rows="3" cols="25" />
                </h:panelGrid>

                <br/>
                <p:commandButton value="Guardar Empleado" 
                                 actionListener="#{empleadoRolFrm.btnCrearEmpleadoHandler()}" 
                                 update=":frmMain:dtEmpleados :messages" 
                                 oncomplete="if (!args.validationFailed) PF('dlgNuevoEmp').hide()" 
                                 icon="pi pi-save" />
            </h:form>
        </p:dialog>
    </h:body>
</html>
